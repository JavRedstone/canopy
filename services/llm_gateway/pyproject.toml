[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-learning-llm-gateway"
version = "0.1.0"
description = "Private provider-neutral LLM gateway for Adaptive Source Learning"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "openai>=2.0",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["llm_gateway"]
