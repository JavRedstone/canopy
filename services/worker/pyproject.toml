[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-learning-worker"
version = "0.1.0"
description = "Background worker scaffold for Adaptive Source Learning"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "pypdf>=6.0",
  "supabase>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["worker"]
