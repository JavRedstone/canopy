services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_AUTH_MODE: ${APP_AUTH_MODE:-supabase}
      APP_REPOSITORY_BACKEND: ${APP_REPOSITORY_BACKEND:-supabase}
      APP_SUPABASE_URL: ${APP_SUPABASE_URL}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${APP_SUPABASE_SERVICE_ROLE_KEY}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      APP_SANDBOX_TIMEOUT_SECONDS: ${APP_SANDBOX_TIMEOUT_SECONDS:-20}
      APP_SANDBOX_RUNNER_URL: http://sandbox-runner:8020
      APP_LLM_GATEWAY_URL: http://llm-gateway:8010
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}

  worker:
    build:
      context: ./services/worker
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_SUPABASE_URL: ${APP_SUPABASE_URL}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${APP_SUPABASE_SERVICE_ROLE_KEY}
      APP_QUEUE_VISIBILITY_SECONDS: ${APP_QUEUE_VISIBILITY_SECONDS:-300}
      APP_QUEUE_POLL_SECONDS: ${APP_QUEUE_POLL_SECONDS:-2}
      APP_SANDBOX_TIMEOUT_SECONDS: ${APP_SANDBOX_TIMEOUT_SECONDS:-20}
      APP_LLM_GATEWAY_URL: http://llm-gateway:8010
      APP_SANDBOX_RUNNER_URL: http://sandbox-runner:8020
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}

  llm-gateway:
    build:
      context: ./services/llm_gateway
    ports:
      - "8010:8010"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-${APP_OPENAI_PROVIDER:-openai}}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      APP_OPENAI_PLANNER_MODEL: ${APP_OPENAI_PLANNER_MODEL:-gpt-5.4-mini}
      APP_OPENAI_EMBEDDING_MODEL: ${APP_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      APP_OPENAI_BUILDER_MODEL: ${APP_OPENAI_BUILDER_MODEL:-gpt-5.6-luna}
      APP_OPENAI_REPAIR_MODEL: ${APP_OPENAI_REPAIR_MODEL:-gpt-5.6-sol}
      APP_AZURE_OPENAI_ENDPOINT: ${APP_AZURE_OPENAI_ENDPOINT:-}
      APP_AZURE_OPENAI_PLANNER_DEPLOYMENT: ${APP_AZURE_OPENAI_PLANNER_DEPLOYMENT:-}
      APP_AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${APP_AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      APP_AZURE_OPENAI_BUILDER_DEPLOYMENT: ${APP_AZURE_OPENAI_BUILDER_DEPLOYMENT:-}
      APP_AZURE_OPENAI_REPAIR_DEPLOYMENT: ${APP_AZURE_OPENAI_REPAIR_DEPLOYMENT:-}
      APP_AWS_REGION: ${APP_AWS_REGION:-}
      APP_AWS_BEDROCK_PLANNER_MODEL: ${APP_AWS_BEDROCK_PLANNER_MODEL:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      APP_AWS_BEDROCK_BUILDER_MODEL: ${APP_AWS_BEDROCK_BUILDER_MODEL:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      APP_AWS_BEDROCK_REPAIR_MODEL: ${APP_AWS_BEDROCK_REPAIR_MODEL:-}
      APP_AWS_BEDROCK_EMBEDDING_MODEL: ${APP_AWS_BEDROCK_EMBEDDING_MODEL:-amazon.titan-embed-text-v2:0}
      APP_AWS_BEDROCK_API_KEY: ${APP_AWS_BEDROCK_API_KEY:-}
      APP_AWS_OPENAI_PLANNER_MODEL: ${APP_AWS_OPENAI_PLANNER_MODEL:-openai.gpt-5.4}
      APP_AWS_OPENAI_BUILDER_MODEL: ${APP_AWS_OPENAI_BUILDER_MODEL:-openai.gpt-5.4}
      APP_AWS_OPENAI_REPAIR_MODEL: ${APP_AWS_OPENAI_REPAIR_MODEL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

  sandbox-runner:
    build:
      context: ./services/sandbox_runner
    ports:
      - "8020:8020"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      APP_SANDBOX_TIMEOUT_SECONDS: ${APP_SANDBOX_TIMEOUT_SECONDS:-20}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
